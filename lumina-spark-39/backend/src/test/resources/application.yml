spring:
  datasource:
    url: jdbc:h2:mem:lumina;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

app:
  jwt:
    secret: test-jwt-secret-key-that-is-long-enough-32
    expiration-ms: 3600000
  cors:
    origins: http://localhost:3000
